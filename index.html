<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home | Artist Name</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
<link rel="stylesheet" href="css/equalizer.css">
</head>
<body data-page="home">
<header class="nav"><a class="logo" href="index.html">ARTIST NAME</a><nav><a href="index.html" data-p="home">Home</a><a href="artist.html" data-p="artist">Artist Info</a><a href="videos.html" data-p="videos">Videos</a><a href="events.html" data-p="events">Events</a></nav></header>
<main class="home">
  <section class="stage">
    <div class="cd-wrap">
      <div class="cd" id="cd" title="Click to play / pause"><div class="hole"></div></div>
      <div class="eq" id="eq"></div>
    </div>
    <ul class="tabs" id="tabs"></ul>
  </section>
  <section class="info">
    <p class="album-year" id="year"></p>
    <h1 id="title">Song Title</h1>
    <h2 id="album">Album Name</h2>
    <p class="lyrics" id="lyrics"></p>
    <p class="hint">Hover a pill to switch albums. Click the disc to play music.</p>
  </section>
  <audio id="audio"></audio>
</main>
<script src="js/main.js"></script>
<script src="js/equalizer.js"></script>
